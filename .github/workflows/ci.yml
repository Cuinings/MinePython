name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run migrations
        # Apply the Alembic schema so the test DB matches production exactly.
        run: python -m alembic upgrade head

      - name: Run tests
        # The live-server smoke test needs a running server and is excluded.
        run: pytest tests/ --ignore=tests/test_ucenter_smoke.py -q
