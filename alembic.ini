# -*- coding: utf-8 -*-
# Alembic configuration for MinePython (P2-1).
#
# The database URL and ORM metadata are injected at runtime by
# migrations/env.py from the live application (modules.user.database), so the URL below
# is intentionally left empty - there is a single source of truth for the
# schema (the SQLAlchemy models), and migrations stay in lock-step with them.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
