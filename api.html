<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 文档 · __TITLE__</title>
    <link rel="stylesheet" href="/static/common.css">
    <style>
        .api-wrap { width: 100%; max-width: 760px; padding: 72px 20px; }
        .api-badge {
            display: inline-block; font-size: 12px; color: var(--green);
            background: rgba(63,185,80,.12); border: 1px solid rgba(63,185,80,.3);
            padding: 4px 13px; border-radius: 20px; margin-bottom: 22px;
        }
        .api-title { font-size: 34px; font-weight: 700; line-height: 1.2; }
        .api-version { color: var(--accent); font-size: 14px; margin-top: 10px; font-variant-numeric: tabular-nums; }
        .api-desc { color: var(--dim); font-size: 15px; line-height: 1.8; margin-top: 20px; }
        .api-cta { margin-top: 38px; display: flex; gap: 14px; flex-wrap: wrap; }
        .api-btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 26px; border-radius: 10px; font-size: 15px; font-weight: 600;
            text-decoration: none; cursor: pointer; transition: .18s;
        }
        .api-btn.primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
        .api-btn.primary:hover { opacity: .88; transform: translateY(-2px); box-shadow: 0 8px 22px rgba(88,166,255,.25); }
        .api-btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
        .api-btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
        .api-meta {
            margin-top: 50px; padding-top: 24px; border-top: 1px solid var(--border);
            display: flex; gap: 28px; flex-wrap: wrap; font-size: 13px; color: var(--dim);
        }
        .api-meta b { color: var(--text); font-weight: 600; }
        .api-foot { margin-top: 36px; font-size: 12px; color: var(--dim); }
    </style>
</head>
<body>
    <div class="api-wrap">
        <span class="api-badge">● API 文档门户</span>
        <div class="api-title">__TITLE__</div>
        <div class="api-version">版本 __VERSION__</div>
        <p class="api-desc">__DESCRIPTION__</p>

        <div class="api-cta">
            <a class="api-btn primary" href="/docs">📘 打开 Swagger UI →</a>
            <a class="api-btn ghost" href="/redoc">📄 ReDoc</a>
        </div>

        <div class="api-meta">
            <span>Base URL：<b>/</b></span>
            <span>规范：<b>OpenAPI 3.0</b></span>
            <span>描述文件：<b>/openapi.json</b></span>
        </div>

        <div class="api-foot">本页为 API 独立入口，无需登录即可访问 Swagger 在线文档与接口调试。</div>
    </div>
</body>
</html>
