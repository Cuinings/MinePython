services:
  fileserver:
    build: .
    container_name: fileserver
    ports:
      - "8000:8000"
    volumes:
      # Persist runtime data across container rebuilds.
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./server.db:/app/server.db
      # Encryption key MUST persist — losing it makes stored plaintext copies
      # unrecoverable. Mounted from the host, never baked into the image.
      - ./.fernet_key:/app/.fernet_key
      # JWT signing secret — MUST persist across container recreations, otherwise
      # all existing sessions are invalidated on every rebuild. Mounted from the
      # host (and chowned to the runtime user by entrypoint.sh). The host file
      # MUST exist before `docker compose up` (even empty) — see deploy notes.
      - ./.jwt_secret:/app/.jwt_secret
      # Site-level settings edited from the admin UI (site name, max upload size)
      # are persisted into this .env by the running container. Mounting the host
      # .env keeps those edits across container recreations. NOTE: the host file
      # MUST exist before `docker compose up` (even empty) — otherwise Docker
      # creates the mount as a *directory* and the app cannot write to it.
      - ./.env:/app/.env
      # TLS cert/key for HTTPS. WebUSB (browser ADB install) requires a
      # secure context, so the page must be served over HTTPS. Generate
      # cert.pem/key.pem into ./ssl on the host, then set SSL_CERTFILE /
      # SSL_KEYFILE in your .env to enable TLS on :8000.
      - ./ssl:/app/ssl
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # ---- Production settings (override via a .env file or your orchestrator) ----
      # Lock CORS to the public origin(s) that serve the UI.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      # ---- ARCH-10: shared database for horizontal scaling ----
      # Unset (default) = local SQLite file. To scale out, run the optional
      # `db` service below (profile `pg`) and point every instance at it:
      #   DATABASE_URL=postgresql://fileserver:fileserver@db:5432/minepython
      - DATABASE_URL=${DATABASE_URL:-}
      # ---- ARCH-9: JWT signing secret (MUST be identical on every instance) ----
      # Generate once and share across nodes, e.g.:
      #   JWT_SECRET=$(python -c "import secrets;print(secrets.token_hex(32))")
      - JWT_SECRET=${JWT_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # --- HTTPS for WebUSB (optional). Set both to enable TLS on :8000. ---
      # cert/key live in ./ssl (mounted above). Leave empty to stay on HTTP.
      - SSL_CERTFILE=${SSL_CERTFILE:-}
      - SSL_KEYFILE=${SSL_KEYFILE:-}
    healthcheck:
      # NOTE: /docs returns 403 in production (DEBUG defaults to false), so the
      # original "curl -f /docs" healthcheck would mark the container UNHEALTHY.
      # Probe "/" (serves index.html, always 200) instead.
      # TLS-aware: try HTTPS first (self-signed ok via -k), fall back to HTTP.
      # Previously hardcoded to http:// which fails once TLS is enabled on :8000.
      test: ["CMD-SHELL", "curl -fk https://localhost:8000/ >/dev/null 2>&1 || curl -f http://localhost:8000/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Optional shared Postgres (ARCH-10). Disabled by default — the app uses the
  # local SQLite file unless DATABASE_URL is set. Bring it up with:
  #   docker compose --profile pg up -d
  # Then set DATABASE_URL on the fileserver (see the env block above) to:
  #   postgresql://fileserver:fileserver@db:5432/minepython
  # All fileserver replicas must share this same DATABASE_URL to scale out.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    profiles: ["pg"]
    container_name: fileserver-db
    environment:
      - POSTGRES_USER=fileserver
      - POSTGRES_PASSWORD=fileserver
      - POSTGRES_DB=minepython
      - TZ=Asia/Shanghai
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileserver -d minepython"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
