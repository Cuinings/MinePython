<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">文件服务器</title>
    <link rel="stylesheet" href="/static/common.css">
</head>
<body>

<!-- ===================== LOGIN SCREEN ===================== -->
<div class="login-container" id="loginScreen">
    <div class="login-card">
        <h1 data-i18n="h1">📁 文件服务器</h1>
        <div class="sub" data-i18n="login_sub">登录以继续</div>
        <div class="error" id="loginError"></div>
        <label data-i18n="username_ph">用户名</label>
        <input type="text" id="loginUser" data-i18n-placeholder="username_ph" placeholder="用户名">
        <label data-i18n="password_ph">密码</label>
        <input type="password" id="loginPass" data-i18n-placeholder="password_ph" placeholder="密码">
        <div id="loginNickRow" style="display:none">
            <label data-i18n="nickname_label">昵称</label>
            <input type="text" id="loginNick" data-i18n-placeholder="nickname_label" placeholder="昵称（可选）">
        </div>
        <button class="btn-login" id="loginSubmitBtn" onclick="doAuth()" data-i18n="login">登录</button>
        <div class="switch" onclick="switchAuthMode()" id="loginSwitch" data-i18n="no_account">没有账号? 注册</div>
        <div class="skip" onclick="skipLogin()" data-i18n="skip_login">跳过, 以匿名身份进入</div>
    </div>
</div>

<!-- ===================== MAIN APP ===================== -->
<div class="app-container" id="appScreen">
    <div class="app-header">
        <h1 data-i18n="h1">📁 文件服务器</h1>
        <div class="header-right">
            <span class="user-menu-wrap">
                <span class="user" id="userDisplay" onclick="toggleUserMenu(event)" style="cursor:pointer"></span>
                <div class="user-dropdown" id="userMenu">
                    <button class="user-menu-item" onclick="openChangePwModal()">🔑 <span data-i18n="change_pw">修改密码</span></button>
                    <button class="user-menu-item danger" onclick="deactivateAccount()">🚪 <span data-i18n="deactivate">注销账号</span></button>
                </div>
            </span>
            <button class="logout-btn" onclick="doLogout()" data-i18n="logout">退出</button>
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" title="切换主题">🌙</button>
            <div class="lang-wrapper">
                <button class="lang-btn" onclick="toggleLangMenu(event)" id="langBtn">EN</button>
                <div class="lang-menu" id="langMenu">
                    <button class="lang-menu-item" data-lang="zh" onclick="switchToLang('zh')">中文</button>
                    <button class="lang-menu-item" data-lang="en" onclick="switchToLang('en')">English</button>
                    <button class="lang-menu-item" data-lang="ru" onclick="switchToLang('ru')">Русский</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== FILES VIEW ===== -->
    <div id="viewFiles" style="display:none">
        <div class="back-row">
            <button class="back-btn" onclick="goHome()" data-i18n="back_home">← 返回首页</button>
        </div>
        <p class="app-subtitle">
            <span data-i18n="subtitle_label">分类管理</span> · <a href="/docs" target="_blank">Swagger API</a>
        </p>
        <div class="cat-bar" id="catBar"></div>
        <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
            <input type="text" id="searchInput" placeholder="搜索文件..." style="flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;outline:none" oninput="onSearch()">
        </div>
        <!-- Upload entry point -->
        <div class="upload-entry-bar" onclick="goUpload()">
            <div class="icon-circle">⬆️</div>
            <div class="label" data-i18n="upload_entry">上传文件</div>
            <div class="arrow">→</div>
        </div>
        <div class="section-header">
            <h2 id="listTitle"></h2>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                <label style="display:flex;gap:4px;align-items:center;font-size:12px;color:var(--dim);cursor:pointer">
                    <input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)" title="全选本页" style="width:16px;height:16px;cursor:pointer">
                    <span data-i18n="select_all">全选</span>
                </label>
                <span style="font-size:11px;color:var(--dim)" id="selectCount"></span>
                <button class="btn btn-xs" onclick="batchDownload()" id="batchDlBtn" style="display:none">批量下载</button>
                <button class="btn btn-xs" onclick="batchDelete()" id="batchDelBtn" style="display:none;color:var(--danger);border-color:var(--danger)">批量删除</button>
                <button class="btn btn-xs" onclick="organizeRoot()" data-i18n-title="organize_title" data-i18n="btn_organize">🗂 整理归类</button>
            </div>
        </div>
        <div class="file-list" id="fileList">
            <div class="empty" data-i18n="loading">加载中...</div>
        </div>
        <div id="pagination" style="display:flex;justify-content:center;gap:8px;margin-top:16px"></div>
    </div>

    <!-- ===== FILE DETAIL VIEW ===== -->
    <div id="viewDetail" style="display:none">
        <div class="back-row">
            <button class="back-btn" onclick="goFiles()" data-i18n="back_files">← 返回文件浏览</button>
        </div>
        <div class="detail-card" id="detailContent"></div>
    </div>

    <!-- ===== UPLOAD VIEW ===== -->
    <div id="viewUpload" style="display:none">
        <div class="back-row">
            <button class="back-btn" onclick="goFiles()" data-i18n="back_files">← 返回文件浏览</button>
        </div>
        <div class="cat-bar" id="uploadCatBar"></div>
        <div class="drop-zone" id="dropZone">
            <span class="icon">⬆️</span>
            <h3 data-i18n="upload_title">点击或拖拽文件到此处上传</h3>
            <p data-i18n="upload_desc">支持任意文件类型，可批量上传</p>
            <span class="cat-hint" id="uploadHint"></span>
            <input type="file" id="fileInput" multiple hidden>
        </div>
        <div id="uploadProgress" style="display:none;margin-top:16px">
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:4px">
                <span id="progressFile"></span><span id="progressPct">0%</span>
            </div>
            <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden">
                <div id="progressBar" style="height:100%;background:var(--accent);width:0;transition:width .2s"></div>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/util.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/theme.js"></script>
<script src="/static/js/toast.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/pending.js"></script>
<script src="/static/js/init.js"></script>
<script>
// ==================== File management logic ====================
var viewMode = 'files'; // files | upload | detail
var activeCat = 'auto';
var currentPage = 1;
var currentSearch = '';
var pageSize = 20;
var dropZone = document.getElementById('dropZone');
var fileInput = document.getElementById('fileInput');
var fileList = document.getElementById('fileList');
var uploadHint = document.getElementById('uploadHint');

function buildCatBar(containerId) {
    var bar = document.getElementById(containerId);
    if (!bar) return;
    fetch('/api/categories', { headers: getAuthHeaders() }).then(function(res) { return res.json(); }).then(function(data) {
        var total = data.categories.reduce(function(s, c) { return s + c.count; }, 0);
        var totalHtml = total ? '<span class="count">' + total + '</span>' : '';
        bar.innerHTML =
            '<span class="cat-tag auto ' + (activeCat==='auto'?'active':'') + '" data-cat="auto" onclick="selectCategory(\'auto\')">' +
                t('auto_tag') + totalHtml +
            '</span>' +
            data.categories.map(function(c) {
                return '<span class="cat-tag ' + (activeCat===c.category?'active':'') + '" data-cat="' + c.category + '" onclick="selectCategory(\'' + c.category + '\')">' +
                    c.category + '<span class="count">' + c.count + '</span>' +
                    '<span class="cat-del" title="' + t('del_title') + '" onclick="delCat(event,\'' + c.category + '\')">✕</span>' +
                '</span>';
            }).join('') +
            '<span class="cat-new" onclick="newCategory()">' + t('new_tag') + '</span>';
    });
}

function selectCategory(cat) {
    activeCat = cat;
    currentPage = 1;
    updateUploadHint();
    buildCatBar('catBar');
    buildCatBar('uploadCatBar');
    if (viewMode === 'files') loadFiles();
}

async function newCategory() {
    var name = prompt(t('prompt_cat'));
    if (!name || !name.trim()) return;
    activeCat = name.trim();
    buildCatBar('catBar');
    buildCatBar('uploadCatBar');
    if (viewMode === 'files') loadFiles();
    updateUploadHint();
}

async function delCat(e, cat) {
    e.stopPropagation();
    if (!confirm(t('confirm_del_cat') + cat + t('and_all_files'))) return;
    var res = await fetch('/api/categories/' + encodeURIComponent(cat), { method: 'DELETE', headers: getAuthHeaders() });
    if (res.ok) {
        if (activeCat === cat) activeCat = 'auto';
        toast(t('toast_deleted'));
        buildCatBar('catBar');
        buildCatBar('uploadCatBar');
        if (viewMode === 'files') loadFiles();
        updateUploadHint();
    } else { toast(t('toast_del_failed'), true); }
}

function updateUploadHint() {
    if (!uploadHint) return;
    if (activeCat === 'auto') {
        uploadHint.textContent = t('hint_auto');
        uploadHint.style.background = 'rgba(163,113,247,.15)';
        uploadHint.style.color = '#a371f7';
    } else {
        uploadHint.textContent = t('hint_target') + activeCat;
        uploadHint.style.background = 'rgba(88,166,255,.15)';
        uploadHint.style.color = '#58a6ff';
    }
}

// Upload
if (dropZone) {
    dropZone.addEventListener('click', function() { fileInput.click(); });
    fileInput.addEventListener('change', function() { uploadFiles(fileInput.files); });
    ['dragenter','dragover'].forEach(function(e) { dropZone.addEventListener(e, function(ev) {
        ev.preventDefault(); dropZone.classList.add('dragover');
    }); });
    ['dragleave','drop'].forEach(function(e) { dropZone.addEventListener(e, function(ev) {
        ev.preventDefault(); dropZone.classList.remove('dragover');
    }); });
    dropZone.addEventListener('drop', function(ev) { uploadFiles(ev.dataTransfer.files); });
}

function uploadFiles(files) {
    if (!files.length) return;
    var cat = activeCat || 'auto';
    var formData = new FormData();
    formData.append('category', cat);

    var isMultiple = files.length > 1;
    if (isMultiple) {
        for (var i = 0; i < files.length; i++) formData.append('files', files[i]);
    } else {
        formData.append('file', files[0]);
    }
    var url = isMultiple ? '/api/upload/multiple' : '/api/upload';

    var progDiv = document.getElementById('uploadProgress');
    var progBar = document.getElementById('progressBar');
    var progFile = document.getElementById('progressFile');
    var progPct = document.getElementById('progressPct');
    progDiv.style.display = 'block';
    progBar.style.width = '0';
    progPct.textContent = '0%';
    progFile.textContent = files.length === 1 ? files[0].name : files.length + ' files';

    var xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    var authHeaders = getAuthHeaders();
    if (authHeaders.Authorization) xhr.setRequestHeader('Authorization', authHeaders.Authorization);

    xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
            var pct = Math.round(e.loaded / e.total * 100);
            progBar.style.width = pct + '%';
            progPct.textContent = pct + '%';
        }
    };

    xhr.onload = function() {
        progDiv.style.display = 'none';
        if (xhr.status >= 200 && xhr.status < 300) {
            toast(t('toast_upload_ok') + (cat === 'auto' ? t('auto_label') : cat));
            buildCatBar('catBar');
            buildCatBar('uploadCatBar');
            goFiles();
        } else {
            toast(t('toast_upload_fail'), true);
        }
        fileInput.value = '';
    };

    xhr.onerror = function() {
        progDiv.style.display = 'none';
        toast(t('toast_upload_fail'), true);
        fileInput.value = '';
    };

    xhr.send(formData);
}

// File list
var PREVIEW_ICONS = {
    '图片': '\ud83d\uddbc\ufe0f', '文档': '\ud83d\udcc4', '视频': '\ud83c\udfa5',
    '音频': '\ud83c\udfb5', '压缩包': '\ud83d\udce6', '代码': '\ud83d\udcbb',
    '安装包': '\ud83d\udce6', '其他': '\ud83d\udcc1'
};
var IMAGE_EXTS = ['.jpg','.jpeg','.png','.gif','.webp','.bmp','.svg','.ico'];

function getPreviewHtml(f) {
    var ext = '.' + f.filename.split('.').pop().toLowerCase();
    var catClass = ' file-preview-' + (f.category || 'other');
    if (IMAGE_EXTS.indexOf(ext) >= 0) {
        return '<div class="file-preview file-preview-img' + catClass + '"><img src="' + downloadUrl(f.path) + '" loading="lazy" onerror="this.parentElement.innerHTML=\'' + (PREVIEW_ICONS[f.category] || '\ud83d\udcc1') + '\'"></div>';
    }
    return '<div class="file-preview' + catClass + '">' + (PREVIEW_ICONS[f.category] || '\ud83d\udcc1') + '</div>';
}

var currentDetailFile = null;

function showFileDetail(f) {
    currentDetailFile = f;
    viewMode = 'detail';
    document.getElementById('viewFiles').style.display = 'none';
    document.getElementById('viewUpload').style.display = 'none';
    document.getElementById('viewDetail').style.display = 'block';

    var ext = '.' + f.filename.split('.').pop().toLowerCase();
    var isImage = IMAGE_EXTS.indexOf(ext) >= 0;
    var preview = isImage
        ? '<img src="' + downloadUrl(f.path) + '" onerror="this.parentElement.innerHTML=\'<span class=icon>' + (PREVIEW_ICONS[f.category] || '\ud83d\udcc1') + '</span>\'">'
        : '<span class="icon">' + (PREVIEW_ICONS[f.category] || '\ud83d\udcc1') + '</span>';

    document.getElementById('detailContent').innerHTML =
        '<div class="detail-preview">' + preview + '</div>' +
        '<div class="detail-info">' +
            '<div class="label">' + (t('detail_name') || 'Filename') + '</div><div class="value">' + f.filename + '</div>' +
            '<div class="label">' + (t('detail_category') || 'Category') + '</div><div class="value">' + f.category + '</div>' +
            '<div class="label">' + (t('detail_path') || 'Path') + '</div><div class="value">' + f.path + '</div>' +
            '<div class="label">' + (t('detail_size') || 'Size') + '</div><div class="value">' + f.size_human + ' (' + (f.size || 0) + ' bytes)</div>' +
            '<div class="label">' + (t('detail_uploader') || 'Uploader') + '</div><div class="value">' + (f.uploader_nickname || f.uploaded_by || 'anonymous') + '</div>' +
            '<div class="label">' + (t('detail_ip') || 'IP') + '</div><div class="value">' + (f.uploaded_ip || '-') + '</div>' +
            '<div class="label">' + (t('detail_time') || 'Time') + '</div><div class="value">' + (f.uploaded_at || '-') + '</div>' +
        '</div>' +
        '<div class="detail-actions">' +
            '<button class="btn" onclick="openPreview(\'' + f.path + '\')">' + t('btn_preview') + '</button>' +
            '<a class="btn" href="' + downloadUrl(f.path) + '" download>' + t('btn_dl') + '</a>' +
            '<button class="btn btn-danger" onclick="delFileFromDetail()">' + t('btn_del') + '</button>' +
        '</div>';
}

async function delFileFromDetail() {
    if (!currentDetailFile) return;
    var f = currentDetailFile;
    if (!confirm(t('confirm_del_file') + f.path + '\"?')) return;
    var res = await fetch('/api/files/' + encodeURIComponent(f.path), { method: 'DELETE', headers: getAuthHeaders() });
    if (res.ok) { toast(t('toast_deleted')); goFiles(); }
    else toast(t('toast_del_failed'), true);
}

async function loadFiles() {
    var params = new URLSearchParams();
    if (activeCat && activeCat !== 'auto') params.set('category', activeCat);
    if (currentSearch) params.set('search', currentSearch);
    params.set('page', currentPage);
    params.set('page_size', pageSize);
    fileList.innerHTML = '<div class="empty">' + t('loading') + '</div>';
    var url = '/api/files?' + params.toString();
    var res = await fetch(url, { headers: getAuthHeaders() });
    if (!res.ok) {
        if (res.status === 401) {
            forceLogout();
        } else {
            fileList.innerHTML = '<div class="empty">' + (t('toast_failed') || 'Failed') + '</div>';
        }
        return;
    }
    var data = await res.json();

    document.getElementById('listTitle').textContent =
        (activeCat && activeCat !== 'auto')
            ? t('cat_label') + activeCat + ' (' + data.total + ')'
            : t('all_files') + ' (' + data.total + ')';

    if (!data.files.length) {
        fileList.innerHTML = '<div class="empty">' + t('no_files') + '</div>';
        document.getElementById('pagination').innerHTML = '';
        updateBatchUI();
        return;
    }
    var showCat = !activeCat || activeCat === 'auto';
    var html = '';
    data.files.forEach(function(f) {
        var by = f.uploaded_by === 'anonymous' ? t('anonymous') : (f.uploader_nickname || f.uploaded_by);
        var preview = getPreviewHtml(f);
        var typeLabel = f.category || 'file';
        // extract extension for badge
        var dotIdx = f.filename.lastIndexOf('.');
        var ext = (dotIdx > 0) ? f.filename.slice(dotIdx + 1).toUpperCase() : '';
        html += '<div class="file-card">' +
            '<input type="checkbox" class="file-check" data-path="' + f.path + '" onclick="event.stopPropagation();updateBatchUI()">' +
            '<div class="file-body" onclick="showFileDetail({filename:\'' +
            f.filename.replace(/'/g, "\\'") + '\',category:\'' + f.category.replace(/'/g, "\\'") +
            '\',path:\'' + f.path.replace(/'/g, "\\'") + '\',size:' + (f.size || 0) + ',size_human:\'' +
            f.size_human + '\',uploaded_by:\'' + (f.uploaded_by || 'anonymous').replace(/'/g, "\\'") +
            '\',uploader_nickname:\'' + (f.uploader_nickname || '').replace(/'/g, "\\'") +
            '\',uploaded_ip:\'' + (f.uploaded_ip || '').replace(/'/g, "\\'") +
            '\',uploaded_at:\'' + (f.uploaded_at || '') + '\'})">' +
            preview +
            '<div class="file-main">' +
                '<div class="file-name-line">' +
                    '<span class="file-name" title="' + f.path + '">' + f.filename + '</span>' +
                    (ext ? '<span class="file-ext-badge">' + escHtml(ext) + '</span>' : '') +
                '</div>' +
                '<div class="file-meta-row">' +
                    (showCat ? '<span class="file-type" title="' + t('detail_category') + '">' + typeLabel + '</span>' : '') +
                    '<span class="file-uploader" title="IP: ' + (f.uploaded_ip || '-') + '">\u25CF ' + escHtml(by) + '</span>' +
                '</div>' +
                '<div class="file-bottom-row">' +
                    '<span class="file-time" title="' + (f.uploaded_at || '') + '">' + (f.uploaded_at || '-') + '</span>' +
                    '<span class="file-size-dot">\u00B7</span>' +
                    '<span class="file-size-val">' + f.size_human + '</span>' +
                '</div>' +
            '</div>' +
            '<div class="file-actions">' +
                '<button class="btn btn-xs" onclick="event.stopPropagation();openPreview(\'' + f.path + '\')">' + t('btn_preview') + '</button>' +
                '<a class="btn btn-xs" href="' + downloadUrl(f.path) + '" download onclick="event.stopPropagation()">' + t('btn_dl') + '</a>' +
                '<button class="btn btn-xs btn-danger" onclick="event.stopPropagation();delFile(\'' + f.path + '\')">' + t('btn_del') + '</button>' +
            '</div>' +
            '</div></div>';
    });
    fileList.innerHTML = html;

    // Pagination
    var totalPages = Math.ceil(data.total / pageSize);
    var pag = '';
    if (totalPages > 1) {
        pag += '<button class="btn btn-xs" onclick="goPage(' + Math.max(1, currentPage-1) + ')" ' + (currentPage<=1?'disabled':'') + '>◀</button>';
        for (var p = 1; p <= totalPages; p++) {
            pag += '<button class="btn btn-xs" onclick="goPage(' + p + ')" style="' + (p===currentPage?'background:var(--accent);color:#fff':'') + '">' + p + '</button>';
        }
        pag += '<button class="btn btn-xs" onclick="goPage(' + Math.min(totalPages, currentPage+1) + ')" ' + (currentPage>=totalPages?'disabled':'') + '>▶</button>';
    }
    document.getElementById('pagination').innerHTML = pag;
    updateBatchUI();
}

function onSearch() {
    currentSearch = document.getElementById('searchInput').value.trim();
    currentPage = 1;
    loadFiles();
}

function goPage(p) {
    currentPage = p;
    loadFiles();
}

function updateBatchUI() {
    var checked = document.querySelectorAll('.file-check:checked');
    var all = document.querySelectorAll('.file-check');
    var count = checked.length;
    document.getElementById('batchDelBtn').style.display = count ? 'inline-block' : 'none';
    document.getElementById('batchDlBtn').style.display = count ? 'inline-block' : 'none';
    document.getElementById('selectCount').textContent = count ? '已选 ' + count + ' 项' : '';
    var selAll = document.getElementById('selectAll');
    if (selAll) selAll.checked = (all.length > 0 && checked.length === all.length);
}

function toggleSelectAll(cb) {
    document.querySelectorAll('.file-check').forEach(function(chk) { chk.checked = cb.checked; });
    updateBatchUI();
}

async function batchDownload() {
    var checked = document.querySelectorAll('.file-check:checked');
    if (!checked.length) return;
    var paths = Array.from(checked).map(function(c) { return c.dataset.path; });
    toast(t('batch_dl_done') || 'Packing...');
    try {
        var res = await fetch('/api/files/batch-download', {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, getAuthHeaders()),
            body: JSON.stringify({ paths: paths }),
        });
        if (!res.ok) {
            var err = await res.json().catch(function() { return {}; });
            toast(err.detail || err.message || t('toast_failed'), true);
            return;
        }
        var blob = await res.blob();
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'files_' + Date.now() + '.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        toast(t('batch_dl_done') || 'Download ready');
    } catch (e) {
        toast(t('toast_failed'), true);
    }
}

async function batchDelete() {
    var checked = document.querySelectorAll('.file-check:checked');
    if (!checked.length) return;
    if (!confirm('确认删除选中的 ' + checked.length + ' 个文件？')) return;
    var paths = Array.from(checked).map(function(c) { return c.dataset.path; });
    var res = await fetch('/api/files/batch-delete', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, getAuthHeaders()),
        body: JSON.stringify({ paths: paths }),
    });
    var data = await res.json().catch(function() { return {}; });
    if (res.ok && data.ok) {
        var skipped = (data.failed && data.failed.length) || 0;
        toast(t('toast_deleted') + (skipped ? ' (' + skipped + ' 跳过)' : ''));
        loadFiles();
        buildCatBar('catBar');
    } else {
        toast(data.detail || data.message || t('toast_del_failed'), true);
    }
}

async function delFile(path) {
    if (!confirm(t('confirm_del_file') + path + '\"?')) return;
    var res = await fetch('/api/files/' + encodeURIComponent(path), { method: 'DELETE', headers: getAuthHeaders() });
    if (res.ok) { toast(t('toast_deleted')); buildCatBar('catBar'); buildCatBar('uploadCatBar'); loadFiles(); }
    else toast(t('toast_del_failed'), true);
}

async function organizeRoot() {
    if (!confirm(t('confirm_organize'))) return;
    var res = await fetch('/api/organize', { method: 'POST', headers: getAuthHeaders() });
    var data = await res.json();
    if (data.ok) {
        toast(t('toast_organized') + data.moved + t('files_suffix'));
        buildCatBar('catBar');
        buildCatBar('uploadCatBar');
        if (viewMode === 'files') loadFiles();
    } else { toast(data.message || t('toast_organize_fail'), true); }
}

// ===== P1-3: inline file preview =====
var PREVIEW_IMG = ['.jpg','.jpeg','.png','.gif','.webp','.bmp','.svg','.ico'];
var PREVIEW_VIDEO = ['.mp4','.webm','.ogg','.mov','.m4v','.avi','.mkv','.wmv','.flv'];
var PREVIEW_AUDIO = ['.mp3','.wav','.flac','.aac','.ogg','.m4a','.opus','.wma'];

function previewUrl(path) {
    return '/api/preview/' + encodeURIComponent(path) + getTokenParam();
}

function openPreview(path) {
    var ext = (path.split('.').pop() || '').toLowerCase();
    var url = previewUrl(path);
    var body;
    if (PREVIEW_IMG.indexOf('.' + ext) >= 0) {
        body = '<img class="preview-media" src="' + url + '">';
    } else if (PREVIEW_VIDEO.indexOf('.' + ext) >= 0) {
        body = '<video class="preview-media" controls autoplay src="' + url + '"></video>';
    } else if (PREVIEW_AUDIO.indexOf('.' + ext) >= 0) {
        body = '<audio class="preview-media" controls autoplay src="' + url + '"></audio>';
    } else {
        // PDF / HTML / text / etc. render inside an iframe.
        body = '<iframe class="preview-frame" src="' + url + '"></iframe>';
    }
    document.getElementById('previewBody').innerHTML = body;
    document.getElementById('previewModal').classList.add('show');
}

function closePreview() {
    var m = document.getElementById('previewModal');
    if (m) m.classList.remove('show');
    var b = document.getElementById('previewBody');
    if (b) b.innerHTML = '';
}

// ===== View navigation (within this module) =====
function goHome() { window.location.href = 'index.html'; }
function goFiles() {
    viewMode = 'files';
    document.getElementById('viewFiles').style.display = 'block';
    document.getElementById('viewUpload').style.display = 'none';
    document.getElementById('viewDetail').style.display = 'none';
    buildCatBar('catBar');
    loadFiles();
}
function goUpload() {
    viewMode = 'upload';
    document.getElementById('viewFiles').style.display = 'none';
    document.getElementById('viewDetail').style.display = 'none';
    document.getElementById('viewUpload').style.display = 'block';
    updateUploadHint();
    buildCatBar('uploadCatBar');
}

function refreshUI() {
    buildCatBar('catBar');
    buildCatBar('uploadCatBar');
    if (viewMode === 'files') loadFiles();
}

// After login / on load, show the file list.
function onAppReady() { goFiles(); }

// ===== Self-service: change password / deactivate account =====
function toggleUserMenu(e) {
    e.stopPropagation();
    // Anonymous guests have no account to manage — keep the menu inert.
    if (authRole === 'anonymous') return;
    document.getElementById('userMenu').classList.toggle('show');
}

function openChangePwModal() {
    document.getElementById('userMenu').classList.remove('show');
    document.getElementById('changePwOld').value = '';
    document.getElementById('changePwNew').value = '';
    document.getElementById('changePwConfirm').value = '';
    document.getElementById('changePwErr').textContent = '';
    document.getElementById('changePwModal').classList.add('show');
}

function closeChangePwModal() {
    document.getElementById('changePwModal').classList.remove('show');
}

async function submitChangePw() {
    var oldP = document.getElementById('changePwOld').value;
    var newP = document.getElementById('changePwNew').value;
    var cfm = document.getElementById('changePwConfirm').value;
    var err = document.getElementById('changePwErr');
    if (!oldP || !newP) { err.textContent = (t('fill_fields') || 'Fill all fields'); return; }
    if (newP !== cfm) { err.textContent = t('pw_mismatch'); return; }
    var res = await fetch('/api/auth/me/password', {
        method: 'PUT',
        headers: Object.assign({ 'Content-Type': 'application/json' }, getAuthHeaders()),
        body: JSON.stringify({ old_password: oldP, new_password: newP }),
    });
    var data = await res.json().catch(function () { return {}; });
    if (res.ok && data.ok) {
        closeChangePwModal();
        forceLogout(t('pw_changed_relogin'));
    } else {
        err.textContent = data.detail || data.message || (t('toast_failed') || 'Failed');
    }
}

async function deactivateAccount() {
    document.getElementById('userMenu').classList.remove('show');
    if (!confirm(t('deactivate_confirm'))) return;
    var res = await fetch('/api/auth/me/deactivate', { method: 'POST', headers: getAuthHeaders() });
    var data = await res.json().catch(function () { return {}; });
    if (res.ok && data.ok) {
        forceLogout(t('acct_deactivated'));
    } else {
        toast(data.detail || data.message || (t('toast_failed') || 'Failed'), true);
    }
}

// Close the user dropdown when clicking outside it.
document.addEventListener('click', function (e) {
    var wrap = document.querySelector('.user-menu-wrap');
    var menu = document.getElementById('userMenu');
    if (menu && menu.classList.contains('show') && wrap && !wrap.contains(e.target)) {
        menu.classList.remove('show');
    }
});

initApp();
</script>

<!-- ===== Modal: Change Password ===== -->
<div class="modal-overlay" id="changePwModal">
    <div class="modal-card">
        <h2 data-i18n="change_pw_title">修改密码</h2>
        <div class="error" id="changePwErr"></div>
        <label data-i18n="old_pw">当前密码</label>
        <input type="password" id="changePwOld" data-i18n-placeholder="old_pw" placeholder="当前密码">
        <label data-i18n="new_pw">新密码</label>
        <input type="password" id="changePwNew" data-i18n-placeholder="new_pw" placeholder="新密码">
        <label data-i18n="confirm_pw">确认新密码</label>
        <input type="password" id="changePwConfirm" data-i18n-placeholder="confirm_pw" placeholder="确认新密码">
        <div class="modal-actions">
            <button class="btn btn-cancel" onclick="closeChangePwModal()" data-i18n="btn_cancel">取消</button>
            <button class="btn btn-save" onclick="submitChangePw()" data-i18n="btn_save">保存</button>
        </div>
    </div>
</div>

<!-- ===== Modal: File Preview (P1-3) ===== -->
<div class="modal-overlay" id="previewModal" onclick="if(event.target===this)closePreview()">
    <div class="modal-card preview-card">
        <div class="preview-header">
            <h2 data-i18n="preview_title">预览</h2>
            <button class="btn btn-cancel" onclick="closePreview()" title="关闭">✕</button>
        </div>
        <div class="preview-body" id="previewBody"></div>
    </div>
</div>
