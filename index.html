<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">MinePython</title>
    <link rel="stylesheet" href="/static/common.css">
</head>
<body>

<!-- ===================== MAIN APP ===================== -->
<div class="app-container" id="appScreen">
    <div class="app-header">
        <h1 data-i18n="h1">📁 MinePython</h1>
        <div class="header-right">
            <span class="user" id="userDisplay"></span>
            <button class="ucenter-btn" onclick="goUserCenter()" data-i18n="ucenter">用户中心</button>
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" title="切换主题">🌙</button>
            <div class="lang-wrapper">
                <button class="lang-btn" onclick="toggleLangMenu(event)" id="langBtn">EN</button>
                <div class="lang-menu" id="langMenu">
                    <button class="lang-menu-item" data-lang="zh" onclick="switchToLang('zh')">中文</button>
                    <button class="lang-menu-item" data-lang="en" onclick="switchToLang('en')">English</button>
                    <button class="lang-menu-item" data-lang="ru" onclick="switchToLang('ru')">Русский</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Pending approval notification (admin only) -->
    <div class="pending-bar" id="pendingBar">
        <span class="count" id="pendingCount"></span>
        <span class="users" id="pendingUsers"></span>
        <button class="btn-approve" onclick="goUserCenter('usermgmt')" data-i18n="view_approvals">查看审批</button>
    </div>

    <!-- ===== HOME VIEW (module entries) ===== -->
    <div id="viewHome">
        <div class="home-wrap">
            <div class="home-grid">
                <div class="home-card" onclick="goFiles()">
                    <div class="home-icon">📁</div>
                    <div class="home-title" data-i18n="nav_files">文件管理</div>
                    <div class="home-desc" data-i18n="home_files_desc">上传、浏览、搜索、下载与管理文件</div>
                </div>
                <div class="home-card" id="homeAuditCard" onclick="goAudit()" style="display:none">
                    <div class="home-icon">🛡️</div>
                    <div class="home-title" data-i18n="nav_audit">审计日志</div>
                    <div class="home-desc" data-i18n="home_audit_desc">查看本人操作记录与安全审计（管理员可见全部）</div>
                </div>
                <div class="home-card" onclick="goSettings()">
                    <div class="home-icon">⚙️</div>
                    <div class="home-title" data-i18n="settings">设置</div>
                    <div class="home-desc" data-i18n="home_settings_desc">个性化与系统偏好设置</div>
                </div>
                <div class="home-card" onclick="goApi()">
                    <div class="home-icon">🔌</div>
                    <div class="home-title">API 文档</div>
                    <div class="home-desc">查看 Swagger 接口文档与在线调试</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/util.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/theme.js"></script>
<script src="/static/js/toast.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/pending.js"></script>
<script src="/static/js/init.js"></script>
<script>
    // ===== Home page: module navigation =====
    function goHome() {
        ['viewFiles','viewUpload','viewDetail','viewAdmin'].forEach(function(id) {
            var el = document.getElementById(id); if (el) el.style.display = 'none';
        });
        var vh = document.getElementById('viewHome'); if (vh) vh.style.display = 'block';
    }
    function goFiles() { window.location.href = 'files.html'; }
    function goUserCenter(tab) { window.location.href = 'users.html' + (tab ? ('?tab=' + tab) : ''); }
    function goAudit() { window.location.href = 'audit.html'; }
    function goSettings() { window.location.href = 'settings.html'; }
    function goApi() { window.location.href = '/api'; }

    // After login / on load, show the home module grid.
    function onAppReady() { goHome(); }

    initApp();
</script>
</body>
</html>
