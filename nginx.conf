# MinePython nginx reverse-proxy TEMPLATE.
# This file uses ${VAR} placeholders and must be rendered before use:
#   export MAX_UPLOAD_SIZE_MB=500
#   envsubst < nginx.conf > /etc/nginx/conf.d/minepython.conf
#   nginx -s reload
# (nginx's client_max_body_size is fixed at worker start and cannot read
#  env vars directly, so a re-render + reload is required after changing it.
#  The app layer (python) picks up the new cap immediately via its own
#  setting; only this proxy limit needs the reload. Keep this value in
#  sync with the admin "max upload size" setting in the UI.)
server {
    listen 80;
    server_name _;
    client_max_body_size ${MAX_UPLOAD_SIZE_MB}M;

    # Static files served directly
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Large file uploads
    location /api/upload {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        client_max_body_size ${MAX_UPLOAD_SIZE_MB}M;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

